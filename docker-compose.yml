# Compose file for production.
#
# Run it on its own — do NOT rely on a bare `docker compose up -d`, which also
# picks up any auto-loaded override file:
#
#   docker compose -f docker-compose.yml up -d --pull always
#
# Or set COMPOSE_FILE=docker-compose.yml once on the host.

volumes:
  db_data:
  storage:

services:
  app:
    # This fork's image, built by .github/workflows/docker-ubuntu.yml. NOT
    # upstream snipe/snipe-it — that one lacks this fork's custom commits.
    #
    # Defaults to `testing` (built from every push to master) because no
    # vX.Y.Z release has been cut yet, so `latest` DOES NOT EXIST in the
    # registry — defaulting to it made this file fail on pull. Once the first
    # release is published, change this default to `latest`, which only ever
    # comes from a release tag and so always means "newest reviewed production
    # build" (see docs/UPDATING.md).
    #
    # Set APP_VERSION to pin a version (8.6.3) or use the slimmer alpine
    # flavour (testing-alpine). For the staging tag use docker-compose.ghcr.yml.
    image: ghcr.io/citadeliscybersecurity/snipe-it:${APP_VERSION:-testing}
    restart: unless-stopped
    volumes:
      - storage:/var/lib/snipeit
    ports:
      - "${APP_PORT:-8000}:80"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file:
      - .env

  db:
    image: mariadb:11.4.7
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      # https://mariadb.com/kb/en/using-healthcheck-sh/#compose-file-example
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 1s
      retries: 5
