# Compose file for production.

volumes:
  db_data:
  storage:

services:
  app:
    # This fork's image, built by .github/workflows/docker-ubuntu.yml. NOT
    # upstream snipe/snipe-it — that one lacks this fork's custom commits.
    # `latest` is only ever published from a vX.Y.Z release tag, so it always
    # means "newest reviewed production build" (see docs/UPDATING.md). Set
    # APP_VERSION to pin a version (8.6.3) or use the slimmer alpine flavour
    # (latest-alpine). For staging/pre-release tags use docker-compose.ghcr.yml.
    image: ghcr.io/citadeliscybersecurity/snipe-it:${APP_VERSION:-latest}
    restart: unless-stopped
    volumes:
      - storage:/var/lib/snipeit
    ports:
      - "${APP_PORT:-8000}:80"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file:
      - .env

  db:
    image: mariadb:11.4.7
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      # https://mariadb.com/kb/en/using-healthcheck-sh/#compose-file-example
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 1s
      retries: 5
