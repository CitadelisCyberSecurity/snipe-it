# Compose file for production.
#
# Run it on its own — do NOT rely on a bare `docker compose up -d`, which also
# picks up any auto-loaded override file:
#
#   docker compose -f docker-compose.yml up -d --pull always
#
# Or set COMPOSE_FILE=docker-compose.yml once on the host.

volumes:
  db_data:
  storage:

services:
  app:
    # This fork's image, built by .github/workflows/docker-ubuntu.yml. NOT
    # upstream snipe/snipe-it — that one lacks this fork's custom commits.
    #
    # Defaults to `latest`, published on every push to master and so always the
    # newest reviewed production build (see docs/UPDATING.md).
    #
    # Set APP_VERSION to pin a version (8.6.3) or use the slimmer alpine
    # flavour (latest-alpine). For the staging tag use docker-compose.ghcr.yml.
    # Published tags are develop/testing/latest plus the upstream version and
    # its minor series (8.6.3, 8.6), each with an -alpine variant. All of them
    # MOVE, including 8.6.3 — pin by @sha256:<digest> if you need one exact
    # build. Per-commit tags are not published.
    image: ghcr.io/citadeliscybersecurity/snipe-it:${APP_VERSION:-latest}
    restart: unless-stopped
    volumes:
      - storage:/var/lib/snipeit
    ports:
      - "${APP_PORT:-8000}:80"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file:
      - .env

  db:
    image: mariadb:11.4.7
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      # https://mariadb.com/kb/en/using-healthcheck-sh/#compose-file-example
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 1s
      retries: 5
