# Promote the validated `testing` image to production by RETAGGING it.
#
# This does not build anything. `docker buildx imagetools create` copies a
# manifest list registry-side, so `latest` ends up pointing at the exact index
# that was smoke-tested -- same bytes, not merely the same source. That closes
# two gaps a rebuild-on-promote leaves open:
#
#   - a rebuild of `master` is only as reproducible as the Dockerfile and its
#     base images, so "we tested this" becomes "we tested something built from
#     the same commit";
#   - anything merged to `master` between validation and promotion silently ends
#     up in the release.
#
# It is also seconds rather than a full multi-arch build, and needs no checkout:
# the version comes from the image's own OCI label, not from the branch.
#
# Attestations and per-arch children ride along untouched -- the index digest is
# unchanged, so referrers still resolve.
name: Promote to production

# Least privilege by default; the one job that needs to push tags opts in below.
permissions: {}

# Never let two promotes race over the same tags.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Resolve and print the plan without moving any tag"
        type: boolean
        default: false
      allow-downgrade:
        description: "Permit promoting an OLDER release than the one latest currently points at"
        type: boolean
        default: false

jobs:
  promote:
    name: Retag testing -> latest
    # Moving production tags, so this is gated three ways:
    #
    #   - repository: never let a fork run it;
    #   - ref: workflow_dispatch runs the workflow file FROM THE SELECTED REF, so
    #     without this a branch that edits this file (dropping the version checks,
    #     or repointing IMG) could be dispatched to publish `latest`. Pinning to
    #     master means the promote logic that runs is always the reviewed one;
    #   - environment: the human gate the design assumes ("when a human says so").
    #     Configure required reviewers on the `production` environment in repo
    #     settings -- otherwise every actor with push access can ship to
    #     production unilaterally. It also gives GitHub's deployment log a record
    #     of who promoted what, which no dispatch alone provides.
    if: github.repository == 'CitadelisCyberSecurity/snipe-it' && github.ref == 'refs/heads/master'
    environment: production
    permissions:
      packages: write # To push the production tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMG: ghcr.io/citadeliscybersecurity/snipe-it
    steps:
      # https://github.com/docker/login-action
      # No buildx setup step: `imagetools` talks to the registry directly and
      # needs no builder instance, so setting one up only added a dependency to
      # the release path.
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `testing` is a MOVING tag, and the concurrency group above only serialises
      # promotes -- it does not stop a merge to master (or a dispatch of the
      # docker workflow) from rebuilding `testing` while this run is in flight.
      # So resolve it to an immutable digest ONCE, here, and refer to that digest
      # for everything below. Otherwise the version read, the rollback digest
      # recorded and the retag source are three independent resolutions of a tag
      # that can change between them, and "we ship the index that was
      # smoke-tested" stops being true within a single run.
      - name: Pin the testing digests
        run: |
          set -euo pipefail

          resolve() {
            docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}'
          }

          ubuntu_digest="$(resolve "${IMG}:testing")"
          alpine_digest="$(resolve "${IMG}:testing-alpine")"

          # Validated before the GITHUB_ENV write: these end up in an image
          # reference, so anything but a well-formed digest must stop the run.
          for digest in "${ubuntu_digest}" "${alpine_digest}"; do
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Refusing to promote a malformed digest: '${digest}'"
              exit 1
            fi
          done

          {
            echo "NEW_LATEST=${ubuntu_digest}"
            echo "NEW_LATEST_ALPINE=${alpine_digest}"
          } >> "$GITHUB_ENV"

          echo "testing        = ${ubuntu_digest}"
          echo "testing-alpine = ${alpine_digest}"

      # The version is read from org.opencontainers.image.version, which
      # docker-ubuntu.yml / docker-alpine.yml stamp from config/version.php at
      # BUILD time. Deriving it from the artifact rather than from master is the
      # point: if master has since moved to 8.7.0, the image being promoted is
      # still 8.6.3 and must be tagged as such.
      #
      # Both flavours are required to agree. A mismatch means one of them failed
      # or was rebuilt independently, and promoting only half would leave
      # latest and latest-alpine on different releases.
      - name: Resolve version from the pinned digests
        env:
          ALLOW_DOWNGRADE: ${{ inputs.allow-downgrade }}
        run: |
          set -euo pipefail

          read_version() {
            # .Image is a per-platform map for an index and a bare config for a
            # single-platform image; a recursive search handles both shapes.
            #
            # Every child must agree. A partial rebuild can leave amd64 and arm64
            # on different releases, and collapsing that to whichever sorts first
            # would publish a version tag that half the index does not match --
            # the same failure the ubuntu/alpine check below rejects, one level
            # down.
            local versions
            versions="$(docker buildx imagetools inspect "$1" --format '{{json .Image}}' \
              | jq -r '[.. | objects | select(has("org.opencontainers.image.version"))
                        | .["org.opencontainers.image.version"]] | unique | join(" ")')"

            if [[ "${versions}" == *" "* ]]; then
              echo "::error::$1 carries more than one version across its children (${versions}). Rebuild both architectures from one commit." >&2
              return 1
            fi

            printf '%s' "${versions}"
          }

          read_revision() {
            docker buildx imagetools inspect "$1" --format '{{json .Image}}' \
              | jq -r '[.. | objects | select(has("org.opencontainers.image.revision"))
                        | .["org.opencontainers.image.revision"]] | unique | first // empty'
          }

          ubuntu_version="$(read_version "${IMG}@${NEW_LATEST}")"
          alpine_version="$(read_version "${IMG}@${NEW_LATEST_ALPINE}")"

          if [[ -z "${ubuntu_version}" || -z "${alpine_version}" ]]; then
            echo "::error::Could not read org.opencontainers.image.version from testing (ubuntu='${ubuntu_version}' alpine='${alpine_version}'). Was the image built before that label was added?"
            exit 1
          fi

          if [[ "${ubuntu_version}" != "${alpine_version}" ]]; then
            echo "::error::testing (${ubuntu_version}) and testing-alpine (${alpine_version}) are different releases. Rebuild both from the same master commit before promoting."
            exit 1
          fi

          if [[ ! "${ubuntu_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Refusing to publish a malformed version tag: '${ubuntu_version}'"
            exit 1
          fi

          # Guard against moving production BACKWARDS. Because every tag here
          # moves, re-running this after a revert -- or promoting a stale
          # `testing` -- would quietly publish an older release as `latest` with
          # nothing in the output to say so. Opt in explicitly if that is really
          # what you want (e.g. a deliberate rollback of a bad release).
          current="$(read_version "${IMG}:latest" 2>/dev/null || true)"
          if [[ -n "${current}" && "${current}" != "${ubuntu_version}" ]]; then
            newest="$(printf '%s\n%s\n' "${current}" "${ubuntu_version}" | sort -V | tail -n1)"
            if [[ "${newest}" != "${ubuntu_version}" ]]; then
              if [[ "${ALLOW_DOWNGRADE}" != "true" ]]; then
                echo "::error::latest is on ${current}; testing is the OLDER ${ubuntu_version}. Re-run with allow-downgrade if this is a deliberate rollback."
                exit 1
              fi
              echo "::warning::Downgrading latest from ${current} to ${ubuntu_version} (allow-downgrade was set)."
            fi
          fi

          # Staleness the version guard above cannot see. Every tag here moves, so
          # a `testing` built weeks ago carries the SAME 8.6.3 as one built this
          # morning and passes the downgrade check untouched. The build stamps the
          # commit it came from in org.opencontainers.image.revision, so compare
          # that against master's tip instead.
          #
          # A warning, not an error: promoting an RC that is deliberately BEHIND
          # master is the entire point of retagging a validated artifact rather
          # than rebuilding. It just should never be a surprise.
          revision="$(read_revision "${IMG}@${NEW_LATEST}")"
          if [[ ! "${revision}" =~ ^[0-9a-f]{40}$ ]]; then
            revision="unknown"
          fi

          if [[ "${revision}" == "unknown" ]]; then
            echo "::warning::testing carries no usable org.opencontainers.image.revision, so it cannot be traced to a commit."
          elif [[ "${revision}" != "${GITHUB_SHA}" ]]; then
            echo "::warning::testing was built from ${revision}, but master is now at ${GITHUB_SHA}. Confirm this is the build you validated."
          fi

          {
            echo "APP_VERSION=${ubuntu_version}"
            echo "APP_VERSION_MINOR=${ubuntu_version%.*}"
            echo "TESTING_REVISION=${revision}"
          } >> "$GITHUB_ENV"

          echo "Promoting upstream ${ubuntu_version} (minor series ${ubuntu_version%.*}) built from ${revision}"

      # Recorded BEFORE the retag so a rollback target survives in the run log.
      # Every published tag moves, including X.Y.Z, so the digest is the only
      # durable handle on the build being replaced.
      #
      # All six, not just `latest`: the two `imagetools create` calls below are
      # not atomic with each other, so a half-failed earlier promote can leave
      # X.Y.Z or the -alpine trio on a different digest than `latest`. Recording
      # only `latest` would then hand you a rollback target that was never what
      # some of these tags pointed at.
      - name: Record the outgoing digests
        run: |
          set -euo pipefail

          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}' 2>/dev/null \
              || echo 'none (tag does not exist yet)'
          }

          {
            echo "OLD_LATEST=$(digest_of "${IMG}:latest")"
            echo "OLD_VERSION=$(digest_of "${IMG}:${APP_VERSION}")"
            echo "OLD_MINOR=$(digest_of "${IMG}:${APP_VERSION_MINOR}")"
            echo "OLD_LATEST_ALPINE=$(digest_of "${IMG}:latest-alpine")"
            echo "OLD_VERSION_ALPINE=$(digest_of "${IMG}:${APP_VERSION}-alpine")"
            echo "OLD_MINOR_ALPINE=$(digest_of "${IMG}:${APP_VERSION_MINOR}-alpine")"
          } >> "$GITHUB_ENV"

      - name: Promote
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail

          echo "  ${NEW_LATEST}        -> latest, ${APP_VERSION}, ${APP_VERSION_MINOR}"
          echo "  ${NEW_LATEST_ALPINE} -> latest-alpine, ${APP_VERSION}-alpine, ${APP_VERSION_MINOR}-alpine"

          if [[ "${DRY_RUN}" == "true" ]]; then
            echo "::notice::Dry run -- no tags were moved."
            exit 0
          fi

          # Sourced from the digests pinned at the start of the run, not from the
          # `testing` tag: a rebuild landing mid-run must not change what ships.
          #
          # Each create is atomic per invocation, but the two are not atomic
          # together: if the second fails, latest and latest-alpine are on
          # different releases until this is re-run. Re-running is safe and
          # idempotent.
          docker buildx imagetools create \
            -t "${IMG}:latest" \
            -t "${IMG}:${APP_VERSION}" \
            -t "${IMG}:${APP_VERSION_MINOR}" \
            "${IMG}@${NEW_LATEST}"

          docker buildx imagetools create \
            -t "${IMG}:latest-alpine" \
            -t "${IMG}:${APP_VERSION}-alpine" \
            -t "${IMG}:${APP_VERSION_MINOR}-alpine" \
            "${IMG}@${NEW_LATEST_ALPINE}"

      # Confirm the tags actually resolve, and that latest now matches the
      # digest testing pointed at rather than whatever was there before.
      - name: Verify
        if: ${{ !inputs.dry-run }}
        run: |
          set -euo pipefail

          for tag in latest "${APP_VERSION}" "${APP_VERSION_MINOR}" \
                     latest-alpine "${APP_VERSION}-alpine" "${APP_VERSION_MINOR}-alpine"; do
            docker buildx imagetools inspect "${IMG}:${tag}" > /dev/null
            echo "ok  ${IMG}:${tag}"
          done

          now="$(docker buildx imagetools inspect "${IMG}:latest" --format '{{.Manifest.Digest}}')"
          if [[ "${now}" != "${NEW_LATEST}" ]]; then
            echo "::error::latest resolved to ${now}, expected ${NEW_LATEST}"
            exit 1
          fi

          now_alpine="$(docker buildx imagetools inspect "${IMG}:latest-alpine" --format '{{.Manifest.Digest}}')"
          if [[ "${now_alpine}" != "${NEW_LATEST_ALPINE}" ]]; then
            echo "::error::latest-alpine resolved to ${now_alpine}, expected ${NEW_LATEST_ALPINE}"
            exit 1
          fi

      # The audit trail a git tag would have given us: what moved, from which
      # digest to which, and who ran it. ghcr-cleanup.yml keeps untagged versions
      # for a grace period specifically so these "Was" digests stay pullable --
      # see the older-than setting there for the actual rollback window.
      - name: Summary
        if: always()
        run: |
          {
            echo "### Promote ${APP_VERSION:-(unresolved)}"
            echo ""
            echo "Triggered by @${GITHUB_ACTOR}${{ inputs.dry-run && ' (dry run)' || '' }}"
            echo ""
            echo "Built from commit \`${TESTING_REVISION:-?}\` (master is at \`${GITHUB_SHA}\`)"
            echo ""
            echo "| Tag | Was | Now |"
            echo "|---|---|---|"
            echo "| \`latest\` | \`${OLD_LATEST:-?}\` | \`${NEW_LATEST:-?}\` |"
            echo "| \`${APP_VERSION:-X.Y.Z}\` | \`${OLD_VERSION:-?}\` | \`${NEW_LATEST:-?}\` |"
            echo "| \`${APP_VERSION_MINOR:-X.Y}\` | \`${OLD_MINOR:-?}\` | \`${NEW_LATEST:-?}\` |"
            echo "| \`latest-alpine\` | \`${OLD_LATEST_ALPINE:-?}\` | \`${NEW_LATEST_ALPINE:-?}\` |"
            echo "| \`${APP_VERSION:-X.Y.Z}-alpine\` | \`${OLD_VERSION_ALPINE:-?}\` | \`${NEW_LATEST_ALPINE:-?}\` |"
            echo "| \`${APP_VERSION_MINOR:-X.Y}-alpine\` | \`${OLD_MINOR_ALPINE:-?}\` | \`${NEW_LATEST_ALPINE:-?}\` |"
            echo ""
            echo "Roll back by pinning the **Was** digest — see docs/RELEASING.md."
          } >> "$GITHUB_STEP_SUMMARY"
