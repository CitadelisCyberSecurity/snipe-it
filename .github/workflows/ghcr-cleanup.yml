# Prunes the ghcr.io/citadeliscybersecurity/snipe-it package so it only ever
# contains the tags documented in docs/UPDATING.md: develop, testing, latest,
# alpine and the immutable X.Y.Z release tags (each with its -alpine variant).
#
# Why this is needed at all: docker-ubuntu.yml and docker-alpine.yml build each
# architecture separately and push it BY DIGEST, then assemble a manifest list in
# their `merge` job. Every run therefore leaves the per-arch child manifests as
# untagged package versions, and moving a tag (develop/testing) orphans the
# previous index and its children. Nothing reclaims them, so the package grows
# without bound. Build cache is NOT a factor here: both workflows use
# cache-to: type=gha, so it lives in the Actions cache, not in GHCR.
#
# Shaped after vaultwarden's .github/workflows/releasecache-cleanup.yml (weekly
# cron + manual dispatch, minimal permissions, pinned action).
name: GHCR Cleanup

# Least privilege by default; the one job that needs to delete opts in below.
permissions: {}

# Never let two prunes race over the same package.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 1 * * FRI'

  workflow_dispatch:
    inputs:
      dry-run:
        description: "Log what would be deleted without deleting it"
        type: boolean
        default: true

jobs:
  cleanup:
    name: Prune GHCR package versions
    # Deleting is irreversible, so never let a fork run this.
    if: github.repository == 'CitadelisCyberSecurity/snipe-it'
    permissions:
      packages: write # To delete package versions
    runs-on: ubuntu-latest
    # No continue-on-error. `validate: true` below exists to catch "did this prune
    # break a live tag", and swallowing the exit code turned a failed validation
    # into a GREEN run -- the same silent-success trap as the regex that matched 0
    # of 40 tags while reporting success. A broken package must page someone.
    timeout-minutes: 30
    steps:
      # https://github.com/dataaxiom/ghcr-cleanup-action
      #
      # Deliberately NOT actions/delete-package-versions (what vaultwarden uses).
      # That action has no manifest awareness: it only sees a flat list of
      # versions, so delete-only-untagged-versions would delete the per-arch and
      # attestation child manifests that latest/develop/testing point AT, leaving
      # those tags pulling to a missing-blob error. Only ~1/3 of this package's
      # untagged versions are actually unreferenced. This action resolves each
      # OCI index's children and attestation referrers first, so an untagged
      # sweep cannot orphan a live tag.
      - name: Prune untagged and orphaned versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Both flavours share one package, differing only by the -alpine tag
          # suffix, so this single run covers Ubuntu and Alpine together.
          package: snipe-it

          # Two things about these patterns, both learned the hard way:
          #
          # 1. use-regex is a GLOBAL switch. It reinterprets delete-tags and
          #    exclude-tags together, never just one, so both must use the same
          #    syntax. Leaving a wildcard glob in regex mode is a silent no-op:
          #    as a regex the glob `[0-9]*.[0-9]*.[0-9]*` matches nearly any
          #    string, since `[0-9]*` matches empty and `.` is any character.
          #
          # 2. In regex mode each input is ONE regex, not a comma-separated list.
          #    The action hands the whole value to validateUserRegex (config.ts),
          #    so a comma is matched literally -- `^a$,^b$` compiles to a pattern
          #    requiring a comma in the tag and therefore matches nothing, with
          #    the run still reporting success. Use alternation, never commas.
          #    A first attempt here did exactly that and matched 0 of 40 tags.

          # Everything that must survive a prune: the moving pointers, plus the
          # immutable X.Y.Z release tags that ARE the release history.
          #
          # The semver branch is the load-bearing part of this file. Release tags
          # are the only immutable tags the package has, and pruning one destroys
          # a rollback target permanently -- so they are named explicitly rather
          # than left to "a tag matched by neither pattern is left alone". That
          # earlier reasoning held only while the delete pattern below also
          # targeted legacy 1.1.x tags. It no longer does, so there is nothing
          # left for a semver exclusion to shield by accident.
          #
          # exclude-tags WINS over delete-tags, so anything listed here is safe
          # regardless of what the pattern below says.
          exclude-tags: '^(latest|testing|develop|alpine)(-alpine)?$|^[0-9]+\.[0-9]+\.[0-9]+(-alpine)?$'

          # One legacy family: <branch>-<sha> per-commit pins, from the type=sha
          # entry that used to be in the docker-*.yml metadata blocks (32
          # accumulated). Nothing mints that shape any more, so this clears on the
          # first run and matches nothing ever after.
          #
          # A `1\.1(\.0)?` branch used to sit here too, aimed at image tags from
          # when the version came off a fork git tag rather than config/version.php.
          # It is GONE deliberately, and must not come back: the release number is
          # now chosen by hand when a tag is pushed, so 1.1.4 is a perfectly
          # possible future release and a pattern that eats it would delete a live
          # release every Friday. Legacy 1.1 / 1.1.0 tags still in the registry
          # have to be removed by hand -- see docs/RELEASING.md.
          #
          # Anchored, and note `develop-[0-9a-f]{7}` cannot match the live
          # `develop-alpine` tag ("alpine" is 6 chars and not all hex). A
          # `develop-*` glob WOULD match it; exclude-tags would catch that, but
          # relying on exclusion to undo an over-broad delete pattern is fragile.
          #
          # Safe even where a matched tag shares a package version with a live one
          # (the newest pin tag sits on the same version as `testing`): the action
          # untags rather than deletes any version carrying more than one tag, and
          # refuses to remove an image's last tag, so the live tag survives.
          delete-tags: '^(master|develop)-[0-9a-f]{7}(-alpine)?$'
          use-regex: true

          # Reclaim the per-arch children left by push-by-digest, plus the
          # indexes orphaned when develop/testing moved.
          delete-untagged: true
          delete-orphaned-images: true

          # RETENTION WINDOW for UNTAGGED versions.
          #
          # This used to BE the rollback horizon. Every published tag moved, so a
          # superseded release ended up carrying no tags at all, and this window
          # was the only thing keeping it pullable. That is no longer the case:
          # X.Y.Z release tags are immutable and excluded above, so release
          # history now lives in the tag namespace and survives indefinitely.
          #
          # What the window still covers is builds that never became a release --
          # a `testing` digest superseded by the next merge to master, or a branch
          # pointer that moved. Four weeks is long enough to return to one of
          # those by digest.
          #
          # older-than restricts processing to versions older than this, so
          # nothing younger is ever a deletion candidate. The cost is that build
          # detritus lingers this long before being reclaimed, which is the
          # intended trade.
          #
          # Do NOT swap this for keep-n-untagged: the action throws if that is set
          # alongside delete-untagged, and a count-based limit is the wrong shape
          # anyway -- a busy week of builds would evict a three-day-old digest.
          older-than: 4 weeks

          # Re-check afterwards that every retained manifest list still has all
          # of its children, i.e. that nothing above broke a live tag.
          validate: true

          dry-run: ${{ inputs.dry-run || false }}
