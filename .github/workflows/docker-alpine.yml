# Snipe-IT (Alpine) Docker image build for GitHub Container Registry (ghcr.io)
name: Docker images (Alpine)

# Run this Build for all pushes to 'master' or develop branch.
# Also run for PRs to ensure PR doesn't break Docker build process.
# Use the Actions tab ("Run workflow") to build any other branch on demand.
#
# Deliberately NOT triggered by git tags. The image version tracks the UPSTREAM
# Snipe-IT release recorded in config/version.php, not a fork git tag, so
# releases need no manual tagging. Leaving a tag trigger in place would let a
# pushed vX.Y.Z mint version tags from the tag NAME instead, which is how the
# image previously ended up published as 1.1.0 while containing upstream 8.6.3.
on:
  push:
    branches:
      - master
      - develop
  # Allows you to run this workflow manually from the Actions tab (any branch)
  workflow_dispatch:

  pull_request:

# GITHUB_TOKEN needs packages:write to push to ghcr.io
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # docker/metadata-action lowercases this automatically
  # (CitadelisCyberSecurity -> citadeliscybersecurity)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Build one image per architecture, each on its own native runner (no QEMU
  # emulation), and push it to the registry BY DIGEST only (no tags yet). The
  # per-arch digests are uploaded as artifacts for the merge job to assemble.
  # ---------------------------------------------------------------------------
  build:
    # Only run for this fork. Never executes on upstream or other forks.
    if: github.repository == 'CitadelisCyberSecurity/snipe-it'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 builds on the standard x86 runner...
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          # ...arm64 builds natively on an ARM runner instead of slow QEMU.
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      # https://github.com/actions/checkout
      - name: Checkout codebase
        uses: actions/checkout@v7

      # Compute the lowercase image reference used for push-by-digest, since a
      # raw image name pushed to a registry must be lowercase
      # (CitadelisCyberSecurity -> citadeliscybersecurity).
      - name: Prepare image reference
        run: echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Derive upstream app version
        run: bash .github/scripts/app-version.sh

      # https://github.com/docker/metadata-action
      # In the split build we only need the labels here; tags are applied to the
      # merged manifest in the merge job below.
      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # Without this the version label is derived from the git ref, so a
          # master build would self-report as "master". Point it at the upstream
          # release the image actually contains.
          labels: |
            org.opencontainers.image.version=${{ env.APP_VERSION }}

      # https://github.com/docker/setup-buildx-action
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # https://github.com/docker/login-action
      - name: Log in to Container Registry
        # Only login if not a PR, as PRs only trigger a Docker build and not a push
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # https://github.com/docker/build-push-action
      # On pushes/tags: push by digest (no tag) so the merge job can combine
      # architectures into a single manifest list. On PRs: build only to verify
      # the Dockerfile still works (type=cacheonly, nothing is pushed).
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.alpine
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
          # Cache per-arch so the two matrix legs don't clobber each other.
          cache-from: type=gha,scope=alpine-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=alpine-${{ matrix.arch }}

      # Save the digest this arch produced to a file named after the digest.
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      # https://github.com/actions/upload-artifact
      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-alpine-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Combine the per-arch digests into ONE multi-arch manifest list and apply the
  # tags:
  #   - Push to the default branch (master) -> "<upstream version>-alpine"
  #     (8.6.3-alpine), "<minor series>-alpine" (8.6-alpine), "latest-alpine" and
  #     "testing-alpine", all pointing at the same manifest. The version comes
  #     from config/version.php, so it names the UPSTREAM Snipe-IT release this
  #     fork is built from.
  #   - Push to any other branch (e.g. develop) -> "<branch>-alpine" only, so
  #     staging builds never touch the production pointers.
  #
  # Every one of these is a MOVING tag: fork commits land on top of an upstream
  # release, so successive master builds republish the same 8.6.3-alpine. There is
  # no immutable tag by design -- pin by digest (image@sha256:...) if you need
  # one build exactly.
  #
  # Deliberately NO per-commit "<branch>-<sha>-alpine" tag either: it minted a
  # permanent registry tag on every push, which is what grew this package to 266
  # versions.
  #
  # suffix=-alpine (flavor) appends to every tag, so this never clobbers the
  # Ubuntu image's tags: latest -> latest-alpine, 8.6.3 -> 8.6.3-alpine, etc.
  # ---------------------------------------------------------------------------
  merge:
    # No digests are produced on PRs, so there is nothing to merge.
    if: github.repository == 'CitadelisCyberSecurity/snipe-it' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    steps:
      # https://github.com/actions/download-artifact
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-alpine-*
          merge-multiple: true

      # Only config/version.php is needed here, to derive the version tags.
      - name: Checkout version file
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            config/version.php
            .github/scripts/app-version.sh
          sparse-checkout-cone-mode: false

      - name: Prepare image reference
        run: echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Derive upstream app version
        run: bash .github/scripts/app-version.sh

      # https://github.com/docker/setup-buildx-action
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # https://github.com/docker/metadata-action
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # Default branch (master) publishes the production set: the upstream
          # version it contains, its minor series, plus the two moving pointers.
          # Any other branch publishes only its own name (develop -> "develop").
          # suffix=-alpine below appends to every one of these.
          #
          # Gated on the ref alone, not on `github.event_name == 'push'`: the old
          # condition meant a manual "Run workflow" on master matched no tag rule
          # at all and produced an untagged manifest.
          tags: |
            type=raw,value=${{ env.APP_VERSION }},enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=${{ env.APP_VERSION_MINOR }},enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=testing,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch,enable=${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
          flavor: |
            latest=false
            suffix=-alpine,onlatest=true

      # https://github.com/docker/login-action
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Assemble one manifest list from every per-arch digest and tag it with all
      # the tags metadata-action computed above.
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect pushed image
        run: |
          docker buildx imagetools inspect \
            "${IMAGE}:$(jq -cr '.tags[0] | split(":")[-1]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
