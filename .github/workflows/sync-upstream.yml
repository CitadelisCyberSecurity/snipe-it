# Automatically sync this fork with upstream STABLE releases.
#
# It watches grokability/snipe-it (the canonical Snipe-IT repo; the old
# snipe/snipe-it now redirects here) and, whenever a new *published, stable*
# release tag appears, brings it into this fork's INTEGRATION branch (develop).
#
# Two-stage promotion (staging before production):
#   upstream release -> [this workflow] PR into `develop` -> validate the
#   develop image -> PR `develop` -> `master` -> tag vX.Y.Z -> `latest` image.
# Syncing into `develop` (not `master`) keeps the large, external upstream drop
# in a staging tier you can build and test before it reaches production.
#
# Safety model (this fork carries custom commits, so history is never clobbered):
#   - If the target branch can fast-forward to the release -> fast-forward + push.
#   - Otherwise (the normal case here, since we have our own commits) -> open a
#     PR from a per-release branch for manual review. GitHub surfaces any
#     conflicts in that PR; we never force-push the target branch.
name: Sync upstream release

on:
  # Check once a day at 06:00 UTC...
  schedule:
    - cron: '0 6 * * *'
  # ...and allow on-demand runs from the Actions tab.
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to sync into (defaults to develop; override to rehearse against a test branch)'
        required: false
        default: develop

# Least privilege: write to contents (push branches/tags) and open PRs.
permissions:
  contents: write
  pull-requests: write

# Never let two sync runs race each other.
concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: grokability/snipe-it
  # Sync target: the integration branch, NOT master. Promote develop -> master
  # via a separate PR, then tag a release for the `latest` image. A manual run
  # may override this (e.g. to rehearse the full path against a test branch);
  # scheduled runs always use develop.
  TARGET_BRANCH: ${{ github.event.inputs.target_branch || 'develop' }}

jobs:
  sync:
    # Only run on this fork; never on further forks of it.
    if: github.repository == 'CitadelisCyberSecurity/snipe-it'
    runs-on: ubuntu-latest
    steps:
      # Full history + tags so we can compute ancestry and merge.
      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git and upstream remote
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Register the "ours" merge driver referenced by .gitattributes so the
          # committed compiled assets auto-resolve to our copy instead of conflicting.
          git config merge.ours.driver true
          git remote add upstream "https://github.com/${UPSTREAM}.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream --tags --quiet
          git fetch origin --tags --quiet

      # /releases/latest returns ONLY the newest published, non-draft,
      # non-prerelease release — exactly the "stable release" gate we want.
      - name: Determine latest upstream stable release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(gh api "repos/${UPSTREAM}/releases/latest" --jq '.tag_name')"
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::Could not determine the latest upstream stable release."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::Latest upstream stable release is $TAG"

      # Decide what to do. State is derived from git itself (no state file):
      # "already synced" == the release commit is an ancestor of our target branch.
      - name: Decide whether a sync is needed
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.rel.outputs.tag }}"
          # Scope the sync branch to the target too, so a rehearsal run against a
          # test branch can never collide with — or silently block — a real sync
          # of the same release into develop.
          BRANCH="sync/upstream-${TAG}-${TARGET_BRANCH//\//-}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          # 1) Already merged? Release commit already contained in target branch.
          if git merge-base --is-ancestor "$TAG" "origin/${TARGET_BRANCH}"; then
            echo "action=none" >> "$GITHUB_OUTPUT"
            echo "::notice::No new release: ${TARGET_BRANCH} already contains ${TAG}."
            exit 0
          fi

          # 2) A sync PR for this exact release already open? Don't open a duplicate.
          if [ -n "$(gh pr list --head "$BRANCH" --base "$TARGET_BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "action=none" >> "$GITHUB_OUTPUT"
            echo "::notice::A sync PR for ${TAG} is already open — leaving it for review."
            exit 0
          fi

          # 3) Can the target branch fast-forward to the release?
          #    (Only when we have NO commits the release lacks.)
          if git merge-base --is-ancestor "origin/${TARGET_BRANCH}" "$TAG"; then
            echo "action=ff" >> "$GITHUB_OUTPUT"
            echo "::notice::Fast-forward to ${TAG} is possible."
          else
            echo "action=pr" >> "$GITHUB_OUTPUT"
            echo "::notice::Fork has custom commits — a PR will be opened for ${TAG}."
          fi

      # Push upstream tags into the fork for traceability (never force; existing
      # tags are left untouched).
      - name: Push upstream tags to fork
        if: steps.decide.outputs.action != 'none'
        run: |
          set -euo pipefail
          echo "::notice::Pushing upstream tags to the fork..."
          git push origin --tags 2>&1 \
            || echo "::warning::Some tags were rejected (already exist / diverged); left as-is."

      # Clean case: no custom commits in the way -> fast-forward and push.
      - name: Fast-forward target branch
        if: steps.decide.outputs.action == 'ff'
        run: |
          set -euo pipefail
          TAG="${{ steps.rel.outputs.tag }}"
          git checkout "$TARGET_BRANCH"
          git merge --ff-only "$TAG"
          git push origin "$TARGET_BRANCH"
          echo "::notice::SYNCED: fast-forwarded ${TARGET_BRANCH} to ${TAG}."

      # Node toolchain for rebuilding compiled assets after a clean merge, so the
      # PR ships freshly-built CSS/JS and no local checkout is ever needed. The
      # Docker image copies these committed files in — there is no in-image asset
      # build — so they must be regenerated here. Version matches the repo .nvmrc.
      - name: Set up Node (for asset rebuild)
        if: steps.decide.outputs.action == 'pr'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Normal case for this fork: build the merge on a disposable per-release
      # branch and open a PR from it for review. The merge happens HERE in CI (not
      # on GitHub's servers) because the .gitattributes `merge=ours` driver — which
      # keeps our committed compiled assets and prevents asset conflicts — is only
      # honored by a local git merge, never by GitHub's PR-merge machinery.
      - name: Open sync pull request
        if: steps.decide.outputs.action == 'pr'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.rel.outputs.tag }}"
          BRANCH="${{ steps.decide.outputs.branch }}"

          # Build the merge on a disposable, automation-owned branch off the default
          # branch (never the target branch itself, so history is never clobbered).
          git checkout -B "$BRANCH" "origin/${TARGET_BRANCH}"

          if git merge --no-edit "$TAG"; then
            # Success: any conflicts were only in the compiled assets and the `ours`
            # driver resolved them to our copy. The branch now contains a clean merge.
            CONFLICT=false
            echo "::notice::${TAG} merged cleanly in CI (compiled-asset conflicts auto-resolved via merge=ours)."
            # Rebuild the compiled assets from the merged source and commit them, so
            # the PR is complete (new PHP + matching CSS/JS) with no local step needed.
            echo "::notice::Rebuilding compiled assets (npm ci && npm run prod)..."
            npm ci
            npm run prod
            git add -A
            git commit -m "chore(assets): rebuild compiled assets for ${TAG}" \
              || echo "::notice::No asset changes to commit."
            NOTE="✅ Merged cleanly in CI **and compiled assets were rebuilt automatically** (\`npm run prod\`). No local checkout needed — review and merge."
          else
            # Real, non-asset conflicts remain. Abort and point the branch at the
            # release commit so GitHub surfaces the conflicts in the PR for you.
            CONFLICT=true
            echo "::warning::CONFLICT: ${TAG} has conflicts beyond the generated assets — manual resolution needed in the PR."
            git merge --abort
            git branch -f "$BRANCH" "$TAG"
            NOTE="⚠️ **This sync has merge conflicts beyond the generated assets** and must be resolved before merging (GitHub shows them below)."
          fi

          # Disposable per-release branch — force push is safe (never the target branch).
          git push --force origin "refs/heads/${BRANCH}"

          # Try to open the PR with the built-in GITHUB_TOKEN. An org/enterprise
          # policy ("Allow GitHub Actions to create and approve pull requests") may
          # block GITHUB_TOKEN from creating PRs — if so, don't fail the job: the
          # sync branch is already pushed and ready, so just print a one-click link
          # to open the PR manually. If the policy is ever enabled, this auto-opens.
          BODY="$(printf "Automated sync of upstream **%s** release **%s** into \`%s\`.\n\n%s\n\nUpstream release notes: https://github.com/%s/releases/tag/%s" "$UPSTREAM" "$TAG" "$TARGET_BRANCH" "$NOTE" "$UPSTREAM" "$TAG")"
          COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/${TARGET_BRANCH}...${BRANCH}?expand=1"

          if gh pr create --base "$TARGET_BRANCH" --head "$BRANCH" \
               --title "Sync upstream release ${TAG}" --body "$BODY"; then
            echo "::notice::PR OPENED to sync ${TAG} into ${TARGET_BRANCH} (conflict=${CONFLICT})."
          else
            echo "::warning::Could not open the PR automatically (GITHUB_TOKEN is likely blocked by the create-PR policy). The sync branch '${BRANCH}' is pushed and ready — open the PR here: ${COMPARE_URL}"
          fi
