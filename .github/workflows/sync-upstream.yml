# Automatically sync this fork with upstream STABLE releases.
#
# It watches grokability/snipe-it (the canonical Snipe-IT repo; the old
# snipe/snipe-it now redirects here) and, whenever a new *published, stable*
# release tag appears, brings it into this fork's INTEGRATION branch (develop).
#
# Two-stage promotion (staging before production):
#   upstream release -> [this workflow] PR into `develop` -> validate the
#   develop image -> PR `develop` -> `master` -> "Promote to production"
#   dispatch -> `latest` image.
# Syncing into `develop` (not `master`) keeps the large, external upstream drop
# in a staging tier you can build and test before it reaches production.
#
# Safety model (this fork carries custom commits, so history is never clobbered):
#   - If the target branch can fast-forward to the release -> fast-forward + push.
#   - Otherwise (the normal case here, since we have our own commits) -> open a
#     PR from a per-release branch for manual review. GitHub surfaces any
#     conflicts in that PR; we never force-push the target branch.
#
# SPLIT INTO FOUR JOBS FOR PRIVILEGE SEPARATION. This workflow ingests, merges
# and BUILDS third-party code on a cron with no human in the loop, so the job
# that executes upstream's code must not be able to write to this repository:
#
#   plan         contents:read                 decide what (if anything) to sync
#   fast-forward contents:write                no upstream code runs; trivial case
#   build-assets contents:read                 <-- runs `npm ci` + `npm run prod`,
#                                                  i.e. upstream's postinstall
#                                                  hooks and webpack config
#   open-pr      contents+pull-requests:write  commits and pushes; runs no npm
#
# The compiled assets travel between build-assets and open-pr as an artifact.
# Keeping them in one job was not enough: a postinstall hook can append to
# $GITHUB_PATH or $GITHUB_ENV, which are shared by *later steps of the same job*,
# and so hijack a privileged step further down. A job boundary is the only real
# barrier.
name: Sync upstream release

on:
  # Check once a day at 06:00 UTC...
  schedule:
    - cron: '0 6 * * *'
  # ...and allow on-demand runs from the Actions tab.
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to sync into (defaults to develop; override to rehearse against a test branch)'
        required: false
        default: develop

# Least privilege by default; every job opts in to exactly what it needs.
permissions: {}

# Never let two sync runs race each other.
concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: grokability/snipe-it
  # Sync target: the integration branch, NOT master. Promote develop -> master
  # via a separate PR, then run "Promote to production" for the `latest` image. A
  # manual run may override this (e.g. to rehearse the full path against a test
  # branch); scheduled runs always use develop.
  TARGET_BRANCH: ${{ github.event.inputs.target_branch || 'develop' }}
  # Paths Laravel Mix regenerates, i.e. exactly the paths .gitattributes marks
  # `merge=ours`. Kept in one place because build-assets tars them and open-pr
  # untars them.
  ASSET_PATHS: public/js public/css public/mix-manifest.json

jobs:
  # ---------------------------------------------------------------------------
  # Work out whether there is anything to do. Read-only: no push, no PR, no npm.
  # State is derived from git itself (no state file): "already synced" == the
  # release commit is an ancestor of our target branch.
  # ---------------------------------------------------------------------------
  plan:
    name: Decide what to sync
    # Only run on this fork; never on further forks of it.
    if: github.repository == 'CitadelisCyberSecurity/snipe-it'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # `gh pr list`, to avoid opening a duplicate
    outputs:
      action: ${{ steps.decide.outputs.action }}
      tag: ${{ steps.rel.outputs.tag }}
      branch: ${{ steps.decide.outputs.branch }}
    steps:
      # Full history + tags so we can compute ancestry. persist-credentials is
      # off throughout this workflow: nothing here needs to reuse the checkout
      # token, and leaving it in .git/config puts it within reach of any code the
      # job later runs.
      # https://github.com/actions/checkout
      - name: Checkout fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # A dispatch input reaches git commands and a branch name below. Constrain
      # it to something that can only ever be a ref.
      - name: Validate the sync target
        run: |
          set -euo pipefail
          if [[ ! "${TARGET_BRANCH}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Refusing an implausible target branch name: '${TARGET_BRANCH}'"
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/remotes/origin/${TARGET_BRANCH}" > /dev/null; then
            echo "::error::Target branch '${TARGET_BRANCH}' does not exist on origin."
            exit 1
          fi

      - name: Add upstream remote
        run: |
          set -euo pipefail
          # Upstream is public, so this needs no credentials.
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream --tags --quiet

      # /releases/latest returns ONLY the newest published, non-draft,
      # non-prerelease release — exactly the "stable release" gate we want.
      - name: Determine latest upstream stable release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(gh api "repos/${UPSTREAM}/releases/latest" --jq '.tag_name')"
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::Could not determine the latest upstream stable release."
            exit 1
          fi

          # $TAG is third-party data, and everything downstream of here consumes
          # it. Pin its shape at the boundary, once:
          #   - git ref names permit " ; $ ` ( ) | & { } ", so an unvalidated tag
          #     name that ever reaches an expression interpolation is shell
          #     injection into a job that can push to this repo;
          #   - a newline would let it forge extra $GITHUB_OUTPUT entries.
          # Refusing anything that is not a plain version is cheaper than
          # auditing every use site.
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Upstream release tag '${TAG}' is not a plain vX.Y.Z version. Refusing to sync it."
            exit 1
          fi

          # It must also be a real tag we fetched, not just a release record.
          if ! git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}" > /dev/null; then
            echo "::error::Release ${TAG} has no such tag in ${UPSTREAM}. Refusing to sync."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::Latest upstream stable release is $TAG"

      - name: Decide whether a sync is needed
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          # Never interpolate a step output straight into a shell script: `${{ }}`
          # is textual substitution that happens before the shell parses the
          # line, so quoting cannot contain it. Passing it through env makes the
          # shell read it as data. (Validated above as well — belt and braces.)
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          # Scope the sync branch to the target too, so a rehearsal run against a
          # test branch can never collide with — or silently block — a real sync
          # of the same release into develop.
          BRANCH="sync/upstream-${TAG}-${TARGET_BRANCH//\//-}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          # 1) Already merged? Release commit already contained in target branch.
          if git merge-base --is-ancestor "$TAG" "origin/${TARGET_BRANCH}"; then
            echo "action=none" >> "$GITHUB_OUTPUT"
            echo "::notice::No new release: ${TARGET_BRANCH} already contains ${TAG}."
            exit 0
          fi

          # 2) A sync PR for this exact release already open? Don't open a duplicate.
          if [ -n "$(gh pr list --head "$BRANCH" --base "$TARGET_BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "action=none" >> "$GITHUB_OUTPUT"
            echo "::notice::A sync PR for ${TAG} is already open — leaving it for review."
            exit 0
          fi

          # 3) Can the target branch fast-forward to the release?
          #    (Only when we have NO commits the release lacks.)
          if git merge-base --is-ancestor "origin/${TARGET_BRANCH}" "$TAG"; then
            echo "action=ff" >> "$GITHUB_OUTPUT"
            echo "::notice::Fast-forward to ${TAG} is possible."
          else
            echo "action=pr" >> "$GITHUB_OUTPUT"
            echo "::notice::Fork has custom commits — a PR will be opened for ${TAG}."
          fi

  # ---------------------------------------------------------------------------
  # Clean case: no custom commits in the way -> fast-forward and push. Runs no
  # upstream code (no npm), so holding contents:write here is safe.
  # ---------------------------------------------------------------------------
  fast-forward:
    name: Fast-forward ${{ needs.plan.outputs.tag }}
    needs: plan
    if: needs.plan.outputs.action == 'ff'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the target branch and the release tag
    steps:
      - name: Checkout fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Fast-forward target branch
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream --tags --quiet

          # Push ONLY this release's tag, not `--tags`. Mirroring upstream's whole
          # tag namespace into the fork puts refs here that point at commits which
          # never reached master; the docker workflows are safe from that only
          # because they have no tag trigger. Keep the blast radius to one known,
          # validated tag. --no-force: an existing tag is never rewritten.
          git push origin --no-force "refs/tags/${TAG}" \
            || echo "::warning::Tag ${TAG} was rejected (already exists / diverged); left as-is."

          git checkout "$TARGET_BRANCH"
          git merge --ff-only "$TAG"
          git push origin "$TARGET_BRANCH"
          echo "::notice::SYNCED: fast-forwarded ${TARGET_BRANCH} to ${TAG}."

  # ---------------------------------------------------------------------------
  # UNTRUSTED-CODE JOB. Builds the merge and regenerates the compiled assets from
  # the merged source, so the PR is complete (new PHP + matching CSS/JS) with no
  # local checkout needed. `npm ci` runs upstream's install hooks and `npm run
  # prod` runs upstream's webpack config, so this job deliberately holds only
  # contents:read and never sees a writable token. Its output is an artifact,
  # reviewed as part of the PR like any other diff.
  # ---------------------------------------------------------------------------
  build-assets:
    name: Rebuild compiled assets
    needs: plan
    if: needs.plan.outputs.action == 'pr'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read # enough to clone; cannot push anywhere
    outputs:
      conflict: ${{ steps.merge.outputs.conflict }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The merge happens HERE in CI (not on GitHub's servers) because the
      # .gitattributes `merge=ours` driver — which keeps our committed compiled
      # assets and prevents asset conflicts — is only honored by a local git
      # merge, never by GitHub's PR-merge machinery.
      - name: Merge the release
        id: merge
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Register the "ours" merge driver referenced by .gitattributes so the
          # committed compiled assets auto-resolve to our copy instead of conflicting.
          git config merge.ours.driver true
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream --tags --quiet

          git checkout -B sync-build "origin/${TARGET_BRANCH}"

          if git merge --no-edit "$TAG"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${TAG} merged cleanly in CI (compiled-asset conflicts auto-resolved via merge=ours)."
          else
            # Real, non-asset conflicts remain. Nothing to build; open-pr will
            # point the branch at the release commit so GitHub surfaces them.
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "::warning::CONFLICT: ${TAG} has conflicts beyond the generated assets — manual resolution needed in the PR."
            git merge --abort
          fi

      # Version matches the repo .nvmrc.
      #
      # NO `cache: npm`, deliberately. setup-node's post-step would save ~/.npm to
      # the Actions cache AFTER `npm ci` below has run upstream's postinstall
      # hooks, i.e. after untrusted code had write access to it. That cache is
      # keyed on runner OS + package-lock.json hash, so any other workflow in this
      # repo restoring the same key would pick up whatever was left there. The job
      # split above stops $GITHUB_ENV / $GITHUB_PATH from crossing the boundary,
      # but the Actions cache tunnels straight through it -- and this runs once a
      # day, so a cold install costs minutes, not a compromise.
      # https://github.com/actions/setup-node
      - name: Set up Node
        if: steps.merge.outputs.conflict == 'false'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc

      # The Docker images copy the committed assets in — there is no in-image
      # asset build — so they must be regenerated here.
      - name: Rebuild compiled assets
        if: steps.merge.outputs.conflict == 'false'
        run: |
          set -euo pipefail
          npm ci
          npm run prod

      # Ship the complete post-build content of the generated paths. open-pr
      # deletes those paths and lays this over the top, which reproduces this
      # tree exactly — including deletions of assets the new build no longer
      # emits, and including any vendored file that lives under them (it was in
      # the checkout, so it is in this tar).
      #
      # This archive is written by the same job that just ran upstream's install
      # hooks and webpack config, so open-pr treats it as untrusted input and
      # audits it before it goes anywhere near the checkout.
      - name: Package the assets
        if: steps.merge.outputs.conflict == 'false'
        run: |
          set -euo pipefail
          tar -czf "${RUNNER_TEMP}/assets.tgz" ${ASSET_PATHS}

      # https://github.com/actions/upload-artifact
      - name: Upload the assets
        if: steps.merge.outputs.conflict == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiled-assets
          path: ${{ runner.temp }}/assets.tgz
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # PRIVILEGED JOB. Redoes the same deterministic merge (cheap, and it runs no
  # npm), lays the rebuilt assets over it, pushes the disposable per-release
  # branch and opens the PR.
  # ---------------------------------------------------------------------------
  open-pr:
    name: Open sync pull request
    needs: [plan, build-assets]
    if: needs.plan.outputs.action == 'pr'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the sync branch and the release tag
      pull-requests: write # open the PR
    steps:
      - name: Checkout fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # https://github.com/actions/download-artifact
      - name: Download the rebuilt assets
        if: needs.build-assets.outputs.conflict == 'false'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compiled-assets
          path: ${{ runner.temp }}

      # This job holds contents:write and its checkout token is still in
      # .git/config, and the archive it is about to unpack was produced by the job
      # that ran upstream's postinstall hooks and webpack config. So unpack it
      # somewhere harmless and audit the result before any of it reaches the
      # checkout, rather than unpacking straight over the working tree:
      #
      #   - into an EMPTY staging dir, so a traversing or symlink-following member
      #     can only reach paths the archive itself created -- never .git/,
      #     .github/workflows/ or the persisted credentials;
      #   - audited on disk afterwards rather than by parsing `tar -tv` output, so
      #     the check does not depend on tar's listing format;
      #   - confined to the three generated paths, because `git add -A` in the
      #     next step would otherwise commit anything else the archive carried.
      - name: Unpack and audit the asset archive
        if: needs.build-assets.outputs.conflict == 'false'
        run: |
          set -euo pipefail

          staging="${RUNNER_TEMP}/assets"
          mkdir -p "${staging}"
          tar -xzf "${RUNNER_TEMP}/assets.tgz" -C "${staging}"

          # Regular files and directories only. A symlink, hardlink, fifo or
          # device node has no business in a webpack output tree, and a symlink is
          # how an archive writes through a path its member names do not reveal.
          if [[ -n "$(find "${staging}" \! -type f \! -type d -print -quit)" ]]; then
            echo "::error::The asset archive contains a link or special file. Refusing to commit it."
            find "${staging}" \! -type f \! -type d -printf '%y %P\n' >&2
            exit 1
          fi

          while IFS= read -r path; do
            case "${path}" in
              public|public/js|public/js/*|public/css|public/css/*|public/mix-manifest.json) ;;
              *)
                echo "::error::The asset archive contains '${path}', outside the generated asset paths (${ASSET_PATHS}). Refusing to commit it."
                exit 1
                ;;
            esac
          done < <(cd "${staging}" && find . -mindepth 1 -printf '%P\n')

          echo "::notice::Asset archive audited: $(find "${staging}" -type f | wc -l) files, all within ${ASSET_PATHS}."

      - name: Build the sync branch
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          BRANCH: ${{ needs.plan.outputs.branch }}
          CONFLICT: ${{ needs.build-assets.outputs.conflict }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream --tags --quiet

          # Push ONLY this release's tag — see the note in fast-forward above.
          git push origin --no-force "refs/tags/${TAG}" \
            || echo "::warning::Tag ${TAG} was rejected (already exists / diverged); left as-is."

          # Everything happens on a disposable, automation-owned branch (never the
          # target branch itself, so history is never clobbered).
          if [[ "${CONFLICT}" == "true" ]]; then
            # Point the branch at the release commit so GitHub surfaces the
            # conflicts in the PR for you. `checkout -B` rather than `branch -f`:
            # git refuses to force-update a branch that is currently checked out,
            # so the old `checkout -B` + `branch -f` pair was a guaranteed
            # "cannot force update the branch" failure on this path.
            git checkout -B "$BRANCH" "$TAG"
          else
            git checkout -B "$BRANCH" "origin/${TARGET_BRANCH}"

            # Same merge build-assets made, with the same `ours` driver, so the
            # tree matches the one the assets were built from.
            git merge --no-edit "$TAG"

            # Replace the generated paths wholesale with the audited ones from the
            # staging dir (see the step above -- the archive is never unpacked
            # over the checkout directly).
            rm -rf ${ASSET_PATHS}
            cp -a "${RUNNER_TEMP}/assets/." .

            git add -A
            git commit -m "chore(assets): rebuild compiled assets for ${TAG}" \
              || echo "::notice::No asset changes to commit."
          fi

          # Disposable per-release branch — force push is safe (never the target branch).
          git push --force origin "refs/heads/${BRANCH}"

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          BRANCH: ${{ needs.plan.outputs.branch }}
          CONFLICT: ${{ needs.build-assets.outputs.conflict }}
        run: |
          set -euo pipefail

          if [[ "${CONFLICT}" == "true" ]]; then
            NOTE="⚠️ **This sync has merge conflicts beyond the generated assets** and must be resolved before merging (GitHub shows them below)."
          else
            NOTE="✅ Merged cleanly in CI **and compiled assets were rebuilt automatically** (\`npm run prod\`). No local checkout needed — review and merge."
          fi

          # Try to open the PR with the built-in GITHUB_TOKEN. An org/enterprise
          # policy ("Allow GitHub Actions to create and approve pull requests") may
          # block GITHUB_TOKEN from creating PRs — if so, print a one-click link and
          # fail, so a blocked token can never look like a healthy sync.
          BODY="$(printf "Automated sync of upstream **%s** release **%s** into \`%s\`.\n\n%s\n\nUpstream release notes: https://github.com/%s/releases/tag/%s" "$UPSTREAM" "$TAG" "$TARGET_BRANCH" "$NOTE" "$UPSTREAM" "$TAG")"
          COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/${TARGET_BRANCH}...${BRANCH}?expand=1"

          if gh pr create --base "$TARGET_BRANCH" --head "$BRANCH" \
               --title "Sync upstream release ${TAG}" --body "$BODY"; then
            echo "::notice::PR OPENED to sync ${TAG} into ${TARGET_BRANCH} (conflict=${CONFLICT})."
          else
            # Fail the job. This used to be a warning, which meant a blocked
            # token produced a GREEN run that had silently skipped the PR — the
            # sync would look healthy while never reaching ${TARGET_BRANCH}.
            # The branch is already pushed, so no work is lost: open the PR from
            # the link below, or enable "Allow GitHub Actions to create and
            # approve pull requests" (see docs/UPDATING.md).
            echo "::error::Could not open the PR automatically (GITHUB_TOKEN is likely blocked by the create-PR policy). The sync branch '${BRANCH}' is pushed and ready — open the PR here: ${COMPARE_URL}"
            exit 1
          fi
