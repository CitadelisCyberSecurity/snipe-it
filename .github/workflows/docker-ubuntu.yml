# Snipe-IT Docker image build for GitHub Container Registry (ghcr.io)
name: Docker images (Ubuntu)

# Run this Build for all pushes to 'master' or develop branch.
# Also run for PRs to ensure PR doesn't break Docker build process.
# Use the Actions tab ("Run workflow") to build any other branch on demand.
#
# Pushing an X.Y.Z tag cuts a RELEASE: this builds that commit and publishes
# `latest` alongside an immutable `X.Y.Z`. X.Y.Z is never moved again, which is
# what makes it the release history -- roll back with `docker pull ...:1.9.3`
# instead of hunting a digest out of an expired run log. Branch pushes still
# publish only moving pointers (`testing` for master, the branch name otherwise).
#
# NOTHING AUTOMATED PUSHES A TAG TO THIS REPO. The upstream sync workflow that
# used to mirror UPSTREAM's release tags here was deleted; upstream releases are
# now merged in by hand (see docs/UPDATING.md). So every tag that reaches origin
# was pushed deliberately by a person.
#
# The pattern is still UNPREFIXED, which keeps the two tag namespaces disjoint:
# fork releases are bare X.Y.Z, upstream's are v-prefixed. A `v*` tag fires
# nothing, so a `git push --tags` that drags upstream's ~300 mirrored refs into
# origin cannot publish anything.
#
# The two negations are not decoration. `3.2.0` (2016) and `5.1.7` (2021) are
# ancient UPSTREAM tags that match this shape AND are genuine ancestors of
# master, so the `guard` job below would happily accept them. They are inert only
# because they already exist in origin and a tag fires on PUSH -- delete and
# re-push one and it would publish an image and repoint `latest` at a 2016 build.
# Excluding them by name makes that a property of this file instead.
#
# A tag can still point at ANY commit, and a tag push runs the workflow file as
# it exists on that ref -- so a tag placed on a commit that rewrote this file
# would run the rewritten version. The `guard` job below closes that: it refuses
# to build a tag whose commit is not an ancestor of master.
on:
  push:
    branches:
      - master
      - develop

    # Negations must follow a positive pattern; `!` is not valid as the first
    # element, and a negation only excludes refs an earlier pattern matched.
    # https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#filter-pattern-cheat-sheet
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '!3.2.0'
      - '!5.1.7'

  # Allows you to run this workflow manually from the Actions tab (any branch)
  workflow_dispatch:

  pull_request:

# Least privilege by default; the jobs that push to ghcr.io opt in below.
permissions:
  contents: read

# Serialise builds per ref. Without this, two merges to master in quick
# succession race in the `merge` job and whichever finishes LAST owns `testing`
# -- which can be the older commit, and that stale RC is then what gets promoted.
# PR builds are throwaway, so superseded ones are cancelled outright.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # docker/metadata-action lowercases this automatically
  # (CitadelisCyberSecurity -> citadeliscybersecurity)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Release gate. A git tag is not a review: it can be pushed at ANY commit,
  # including one on an unmerged branch that rewrote this workflow, and a tag
  # push runs the workflow file from the tag's own ref. So before a tag is
  # allowed to publish `latest`, require that its commit is reachable from
  # master -- i.e. that it went through the master PR gate.
  #
  # This replaces the `github.ref == 'refs/heads/master'` pin that the old
  # promote.yml dispatch relied on for the same purpose.
  #
  # Runs first so a bad tag costs seconds rather than a full multi-arch build.
  # Skipped entirely on branch and PR builds, which publish no production tag.
  # ---------------------------------------------------------------------------
  guard:
    name: Release gate
    # Runs on EVERY event, and the work is gated per-STEP rather than on the job.
    #
    # That is deliberate and was learned twice. Gating the job itself on
    # `github.ref_type == 'tag'` made it SKIP on branch and PR builds -- and a
    # skipped job skips everything downstream of it in the `needs` graph,
    # TRANSITIVELY. A dependent only escapes that by including a status check
    # function (always(), !cancelled(), ...) in its own `if`, and adding one to
    # `build` was not enough because `merge` sits downstream of `build`.
    #
    # The cost of that pattern, in one afternoon: PR image builds silently
    # disabled, then the `develop` image not republished on merge. Both showed
    # up as GREEN skipped runs. A job that runs for a few seconds and does
    # nothing is far cheaper than a dependency graph whose correctness depends
    # on remembering this rule at every new edge.
    if: github.repository == 'CitadelisCyberSecurity/snipe-it'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Nothing to gate
        if: github.ref_type != 'tag'
        run: echo "::notice::Branch build -- no release tag to verify."

      # https://github.com/actions/checkout
      # fetch-depth: 0 -- the ancestry check needs real history, not a shallow
      # single-commit clone. persist-credentials: false because nothing here
      # pushes; leaving the token in .git/config would only widen the blast
      # radius of anything that runs afterwards.
      #
      # Skipped entirely on branch builds, so they pay job startup and nothing else.
      - name: Checkout codebase
        if: github.ref_type == 'tag'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a tag that is not an ancestor of master
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail

          # Compare against FETCH_HEAD, not origin/master: it is exactly the ref
          # just fetched, with no dependence on how the remote-tracking refspec
          # happens to be configured in the checked-out clone.
          git fetch --no-tags origin master

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not an ancestor of master. Merge to master first, then tag the merged commit."
            exit 1
          fi

          echo "${GITHUB_REF_NAME} -> ${GITHUB_SHA} is on master. Proceeding."

  # ---------------------------------------------------------------------------
  # Build one image per architecture, each on its own native runner (no QEMU
  # emulation), and push it to the registry BY DIGEST only (no tags yet). The
  # per-arch digests are uploaded as artifacts for the merge job to assemble.
  # ---------------------------------------------------------------------------
  build:
    # Only run for this fork. Never executes on upstream or other forks.
    #
    # Plain `needs` semantics, no status check function required: `guard` now
    # always runs and always succeeds unless it actively rejects a tag, so there
    # is no skip to propagate and nothing here has to know about that rule.
    needs: [guard]
    if: github.repository == 'CitadelisCyberSecurity/snipe-it'
    permissions:
      contents: read
      packages: write # push-by-digest (skipped on PRs, which never log in)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 builds on the standard x86 runner...
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          # ...arm64 builds natively on an ARM runner instead of slow QEMU.
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      # https://github.com/actions/checkout
      - name: Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing in this job talks to git -- the image is pushed with
          # docker/login-action and GITHUB_TOKEN -- so leaving the credential in
          # .git/config would only widen the blast radius of whatever runs after
          # it. Same reasoning as the guard job above. Adopted from upstream.
          persist-credentials: false

      # Compute the lowercase image reference used for push-by-digest, since a
      # raw image name pushed to a registry must be lowercase
      # (CitadelisCyberSecurity -> citadeliscybersecurity).
      - name: Prepare image reference
        run: echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      # https://github.com/docker/metadata-action
      # In the split build we only need the labels here; tags are applied to the
      # merged manifest in the merge job below.
      #
      # org.opencontainers.image.version is left to metadata-action's own ref
      # derivation, which is now exactly what we want: a tag build self-reports
      # as `2.0.0`, a branch build as `develop`/`master`. It used to be
      # overridden with the UPSTREAM Snipe-IT version parsed out of
      # config/version.php, because promote.yml read that label back to decide
      # which version tag to publish. Nothing reads it back any more -- the
      # release version IS the pushed tag -- so the override and the script that
      # produced it (.github/scripts/app-version.sh) are both gone.
      #
      # Consequence worth knowing: the upstream Snipe-IT version is no longer
      # discoverable from the registry. It is still reported at runtime in the
      # app footer and by /api/v1/version, both of which read config/version.php.
      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}

      # https://github.com/docker/setup-buildx-action
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # https://github.com/docker/login-action
      - name: Log in to Container Registry
        # Only login if not a PR, as PRs only trigger a Docker build and not a push
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # https://github.com/docker/build-push-action
      # On pushes/tags: push by digest (no tag) so the merge job can combine
      # architectures into a single manifest list. On PRs: build only to verify
      # the Dockerfile still works (type=cacheonly, nothing is pushed).
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
          # Cache per-arch so the two matrix legs don't clobber each other.
          cache-from: type=gha,scope=ubuntu-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ubuntu-${{ matrix.arch }}

      # Save the digest this arch produced to a file named after the digest.
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      # https://github.com/actions/upload-artifact
      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-ubuntu-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Combine the per-arch digests into ONE multi-arch manifest list and apply the
  # tags. Which names get applied depends on WHAT TRIGGERED the run, the same
  # split vaultwarden's release.yml makes between its branch and tag triggers:
  #
  #   - Push of an X.Y.Z tag -> "X.Y.Z" + "latest". This is a release.
  #   - Push to the default branch (master) -> "testing" only. Release candidate:
  #     master is the production gate, but merging it does not ship.
  #   - Push to any other branch (e.g. develop) -> "<branch>" only, so staging
  #     builds never touch the production pointers.
  #
  # X.Y.Z is the ONLY immutable tag published anywhere in this repo, and that is
  # the entire point of it. `latest`, `testing` and the branch pointers all move,
  # so a superseded build ends up carrying no tag at all and ghcr-cleanup.yml
  # eventually reclaims it. The version tag is the only thing keeping past
  # releases pullable -- so never move one by hand, and never reuse a number.
  #
  # Deliberately NO per-commit "<branch>-<sha>" tag: it minted a permanent
  # registry tag on every push, which is what grew this package to 266 versions.
  # ---------------------------------------------------------------------------
  merge:
    # No digests are produced on PRs, so there is nothing to merge. `needs: build`
    # already requires every matrix leg to have succeeded, so no explicit result
    # test is needed on top of it.
    if: github.repository == 'CitadelisCyberSecurity/snipe-it' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write # push the tagged manifest list
      # The last two are for the release attestation at the end of this job.
      # Job-level permissions cannot be conditional, so they are granted on every
      # run while the attest STEP is gated on a tag build. Both are narrow:
      # id-token mints a short-lived OIDC token scoped to this repo and workflow,
      # and attestations only writes to the attestation store.
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      # A non-default branch is tagged with its own NAME (type=ref below), and
      # workflow_dispatch accepts ANY ref. So a branch called `testing` could be
      # dispatched to overwrite the release candidate, and one called `latest`,
      # `alpine` or `8.6.4` could publish a production pointer directly --
      # skipping the release path and its ancestry check entirely. Neither needs
      # more than push access to pull off, so refuse the names rather than
      # trusting that nobody creates such a branch.
      - name: Refuse reserved image tag names
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # Tag refs are exempt, and MUST be: a release tag is literally named
          # `2.0.0`, which matches the version-shaped pattern below. Without this
          # branch every release would fail on this step. Tags get their own,
          # stricter vetting in the `guard` job -- the commit has to be on master.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            exit 0
          fi

          # The default branch is exempt: it gets `testing` from an explicit
          # type=raw rule, not from its name.
          if [[ "${REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
            exit 0
          fi

          if [[ "${REF_NAME}" =~ ^(latest|testing|alpine)$ || "${REF_NAME}" =~ ^v?[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::'${REF_NAME}' is a reserved image tag name. Releases are published only by pushing an X.Y.Z git tag; rename the branch to build it."
            exit 1
          fi

      # https://github.com/actions/download-artifact
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-ubuntu-*
          merge-multiple: true

      # No checkout at all in this job any more. It used to sparse-checkout
      # config/version.php to derive the version tags; the version now comes from
      # the tag name, which arrives in the event payload.
      - name: Prepare image reference
        run: echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      # https://github.com/docker/setup-buildx-action
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # https://github.com/docker/metadata-action
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          # An X.Y.Z tag publishes the release pair; master publishes the release
          # candidate; any other branch publishes only its own name
          # (develop -> "develop").
          #
          # type=ref,event=tag rather than type=semver: the tag is already a bare
          # X.Y.Z, so there is nothing to normalise, and type=semver would also
          # happily mint a version tag from a `v`-prefixed or pre-release ref that
          # the trigger pattern is specifically shaped to exclude.
          #
          # Every rule is gated on the REF, not on github.event_name: a manual
          # "Run workflow" on master used to match no rule at all and produced an
          # untagged manifest. A dispatch on master therefore rebuilds `testing`,
          # which is what you want for re-running a failed RC build.
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=testing,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch,enable=${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
          # latest=false disables metadata-action's own auto-latest heuristic,
          # which would attach `latest` on any tag-shaped ref. `latest` is
          # published by the explicit type=raw rule above instead, so the ref-type
          # gate is visible in one place rather than inferred from a flavor.
          flavor: |
            latest=false

      # https://github.com/docker/login-action
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Assemble one manifest list from every per-arch digest and tag it with all
      # the tags metadata-action computed above.
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      # Resolve the index digest by INSPECTING the tag just pushed, rather than by
      # scraping it out of the create output. It becomes the attestation subject
      # below, so a wrong value here would sign something other than what shipped.
      - name: Inspect pushed image
        run: |
          set -euo pipefail

          tag="$(jq -cr '.tags[0] | split(":")[-1]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          docker buildx imagetools inspect "${IMAGE}:${tag}"

          digest="$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{.Manifest.Digest}}')"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve a manifest digest for ${IMAGE}:${tag} (got '${digest}')"
            exit 1
          fi

          echo "DIGEST_SHA=${digest}" >> "$GITHUB_ENV"

      # https://github.com/actions/attest
      #
      # Releases only -- branch builds are rebuilt constantly and attesting each
      # one would add a referrer manifest to the package on every push.
      #
      # What it buys: proof the index was produced by THIS workflow in THIS repo
      # at a known commit, rather than pushed by someone holding a leaked token.
      #
      #   gh attestation verify oci://ghcr.io/citadeliscybersecurity/snipe-it:2.0.0 \
      #     -R CitadelisCyberSecurity/snipe-it
      #
      # push-to-registry stores it as an OCI referrer beside the index so it
      # travels with the image. ghcr-cleanup.yml resolves referrers before
      # pruning, so the weekly run cannot orphan it.
      - name: Attest release manifest
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST_SHA }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### ${IMAGE}"
            echo ""
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              echo "**Release ${GITHUB_REF_NAME}** from \`${GITHUB_SHA}\`"
            else
              echo "Branch build of \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA}\`)"
            fi
            echo ""
            echo "\`${DIGEST_SHA}\`"
            echo ""
            echo "| Tag |"
            echo "|---|"
            jq -r '.tags[] | "| `" + . + "` |"' <<< "$DOCKER_METADATA_OUTPUT_JSON"
          } >> "$GITHUB_STEP_SUMMARY"
